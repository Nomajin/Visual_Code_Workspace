<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>iniSesion</title>

</head>
<body>
    <header>
        <a href="../Logikos.html">
        <img id="logo" src="../images/wix/Logo.png" alt="Logotipo del sitio web">
        </a>

        <p id = "Log"> Logikos</p>
        <p id = "tu_mundo"> Tu mundo en codigo</p>

        <nav>
            <ul>
                <li> <a href="#Conocenos"> Cursos </a> </li>
                <li> <a href="#Cursos"> Contacto </a> </li> 
                <li> <a href="#Que_Ofrecemos"> Que_Ofrecemos </a> </li>

            </ul>

            <div>
                <a href ="../pages/IniSesion.html">
                <img id="Avatar" src="../images/wix/Avatar_con_fondo.png" alt="Logo Avatar">
                </a>
            </div>
                
    </header>
    <main>
        <form novalidate class="Inicio-Sesion-Registro">
            <h1>Regístrate</h1>
            <input class="Campos_Formulario" type="text" name="nombre" value="" placeholder="Nombre">
            <input class="Campos_Formulario" type="text" name="apellido/s" value="" placeholder="Apellido/s">
            <input class="Campos_Formulario" type="email" name="correo" value="" placeholder="Correo electrónico">
            <input class="Campos_Formulario" type="password" name="contraseña" value="" placeholder="Contraseña">
            <input class="Campos_Formulario" type="password" name="repetir_contraseña" value="" placeholder="Repetir contraseña">
            <input class="Casilla_Verificacion" type="checkbox" id="remember">
            <label for="remember">Recordarme</label>
            <input class="Botones_Formulario" type="submit" name="" value="Iniciar Sesión">
            <p><a href="../pages/IniSesion.html">¿Ya habias iniciado sesion antes? Iniciar Sesion</a></p>

        </form>
    </main>
</body>
</html>
