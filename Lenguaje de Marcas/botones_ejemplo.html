<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página</title>
</head>
<body>
    <main>
        <form>
            <label for="edad">Introduzca su edad</label>
            <input type="range" min="18" max="100" step="2" value="0" id="edad"
            oninput="document.getElementById('valor').textContent=value">
            <output id="valor"></output>
        </form>
    </main>
</body>
</html>
